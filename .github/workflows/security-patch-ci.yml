name: DLUX security patch CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dlux-security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dependency and application checks (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify installed versions
        id: versions
        continue-on-error: true
        run: npm ls next sharp eslint-config-next swiper sanitize-html

      - name: Audit production dependencies
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Generate Next.js type declarations
        id: typegen
        continue-on-error: true
        run: npx next typegen

      - name: Type-check
        id: types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Security unit tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Compile-only build (no CMS secrets; pages not prerendered)
        id: build
        continue-on-error: true
        run: npx next build --webpack --experimental-build-mode=compile

      - name: Overall result
        if: always()
        env:
          VERSIONS: ${{ steps.versions.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPEGEN: ${{ steps.typegen.outcome }}
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "Dependencies: $VERSIONS"
          echo "Security audit: $AUDIT"
          echo "Lint: $LINT"
          echo "Type generation: $TYPEGEN"
          echo "Type-check: $TYPES"
          echo "Unit tests: $TESTS"
          echo "Compile-only build: $BUILD"
          for r in "$VERSIONS" "$AUDIT" "$LINT" "$TYPEGEN" "$TYPES" "$TESTS" "$BUILD"; do
            if [ "$r" != success ]; then
              echo "One or more checks did not pass. Review individual logs before merging."
              exit 1
            fi
          done
